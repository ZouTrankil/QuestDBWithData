plugins { id 'application' }

dependencies {
    implementation project(':data-core')
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.7'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.questdb:questdb-client:1.3.8'
    implementation 'org.apache.poi:poi:5.5.1'
    implementation('org.flywaydb:flyway-core') { version { strictly '11.9.0' } }
    runtimeOnly 'org.flywaydb:flyway-database-questdb:10.26.0'
}
application { mainClass = 'com.zoutrankil.data.QuestDataApplication' }
tasks.named('jar') { archiveBaseName = 'QuestDBWithData' }

// Explicit retained-original-artifact parity; never part of the ordinary offline test task.
tasks.register('retainedParityTest', Test) {
    group = 'verification'
    description = 'Runs six retained parity methods only after all original inputs pass admission.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    workingDir rootProject.projectDir
    systemProperty 'cli.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
    useJUnitPlatform {
        excludeTags = [] as Set
        includeTags 'retained-parity'
    }
    environment 'RUN_RETAINED_PARITY', '1'
    filter {
        includeTestsMatching('com.zoutrankil.data.cli.IndexMembershipPlanningStartupTest.offlinePlanRegistersOwnerAndRejectsExecutionOnlyOrMalformedOptions')
        includeTestsMatching('com.zoutrankil.data.index.application.IndexMembershipJobPlanTest.savedRealCatalogFreezesExplicitScopesAndRejectsDrift')
        includeTestsMatching('com.zoutrankil.data.index.application.IndexMembershipJobPlanTest.matchingHashDoesNotExcuseInvalidOrIncompleteCatalog')
        includeTestsMatching('com.zoutrankil.data.index.application.IndexMembershipMappingTest.realCurrentAndHistoricalRowsHaveSeparatePeriodKeysWithoutInventedWeight')
        includeTestsMatching('com.zoutrankil.data.index.application.IndexMembershipMappingTest.actualLegacyRowsNormalizeOnlyExplicitNoneDateSentinel')
        includeTestsMatching('com.zoutrankil.data.index.application.IndexMembershipMergeEvidenceTest.boundedRealIndustrySourceMergesWithRetainedActualDatabaseReadback')
    }
    doFirst {
        def originals = [
            'artifacts/java-migration/D005/discovery-8303c5c1-b6ec-4472-9a0d-0d9e2486ea66/classification-8b4429b7-1613-49cd-9692-e6ce0422602a.json',
            'artifacts/java-migration/D005/source-preflight-e26420e4-9eda-41a7-9a91-2329ce57419f/Y-response.json',
            'artifacts/java-migration/D005/source-preflight-e26420e4-9eda-41a7-9a91-2329ce57419f/N-response.json',
            'artifacts/java-migration/D005/physical-baseline.json',
            'artifacts/java-migration/D005/read-live.json'
        ]
        def missing = originals.findAll { relative ->
            !java.nio.file.Files.isRegularFile(rootProject.file(relative).toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS)
        }
        if (!missing.empty) throw new GradleException('Retained parity unavailable; original files are required: ' + missing.join(', '))
        def classification = rootProject.file('artifacts/java-migration/D005/discovery-8303c5c1-b6ec-4472-9a0d-0d9e2486ea66/classification-8b4429b7-1613-49cd-9692-e6ce0422602a.json')
        def actual = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(classification.bytes))
        if (actual != '00936922ec3a79d7105e7cae37d28d955ebc41da1c67de9c45bc87024817d668') throw new GradleException('Original retained classification SHA-256 differs')
        // The other four files have no recorded original fixed SHA. Do not invent a provenance claim.
    }
}

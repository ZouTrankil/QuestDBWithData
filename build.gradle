plugins { id 'application' }

// Keep module outputs isolated under the single top-level build directory.
// Explicit build-directory overrides (for isolated runs) still take precedence.
subprojects {
    def moduleOutputPath = project.path.substring(1).replace(':', '/')
    layout.buildDirectory.convention(rootProject.layout.buildDirectory.dir("modules/${moduleOutputPath}/_output"))
}

allprojects {
    // 嵌套项目会有同名 source/batch；组件坐标也用完整路径，避免 Gradle 把依赖替换成自身。
    group = project == rootProject ? 'com.zoutrankil' : 'com.zoutrankil' + project.path.replace(':', '.').replace('-', '.')
    version = '0.1.0'
    repositories { mavenCentral() }
    dependencyLocking { lockAllConfigurations() }
    plugins.withId('java') {
        if (project != rootProject) tasks.named('jar') { archiveBaseName = project.path.substring(1).replace(':', '-') }
        java { toolchain { languageVersion = JavaLanguageVersion.of(24) } }
        // 通过多层 api 传递时也保留原兼容组合，不能被 Boot BOM 升到 12.x。
        configurations.configureEach { resolutionStrategy.force 'org.flywaydb:flyway-core:11.9.0' }
        dependencies {
            testImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testImplementation 'org.mockito:mockito-core'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform { excludeTags 'retained-parity' }
            workingDir rootProject.projectDir
        }
        tasks.withType(JavaExec).configureEach { workingDir rootProject.projectDir }
    }
}


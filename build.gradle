// 父工程的 build/check/assemble 覆盖所属子模块；clean 仍只清理自己的输出。
[project(':platform'), project(':markets'), project(':platform:engine'), project(':markets:cn'), project(':markets:us'), project(':markets:btc')].each { parent ->
    def children = modules.findAll { it.path.startsWith(parent.path + ':') }
    ['assemble', 'check'].each { name ->
        parent.tasks.named(name) { dependsOn children.collect { it.tasks.named(name) } }
    }
    if (!parent.plugins.hasPlugin('java')) {
        parent.tasks.register('test') {
            group = 'verification'
            description = '运行本父工程下各 Java 子模块的测试。'
            dependsOn children.collect { it.tasks.named('test') }
        }
    }
}
// Runtime configuration has one editable source, shared by the independent distributions.
// 只分发公开运行配置；本机覆盖和示例文件不进入 jar 或发行包。

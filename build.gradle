tasks.register('verifyModuleBoundaries') {
    group = 'verification'
    dependsOn(modules.collect { it.tasks.named('jar') }, tasks.named('jar'))
    doLast {
        def requireCondition = { condition, message -> if (!condition) throw new GradleException(message) }
        [project(':platform'), project(':markets')].each { parent ->
            requireCondition(!parent.plugins.hasPlugin('java') && fileTree(parent.file('src')).files.empty,
                    "聚合父工程不能放业务代码或生成业务 jar：${parent.path}")
        }
        requireCondition(subprojects.findAll { it.plugins.hasPlugin('java') }.toSet() == modules.toSet(),
                '实际 Java 子模块与聚合检查清单不同步')
        def expected = [
            ':platform:core': [],
            ':platform:runtime-support': [':platform:core'],
            ':platform:engine': [':platform:core'],
            ':platform:engine:source': [':platform:engine'],
            ':platform:engine:questdb': [':platform:engine'],
            ':platform:engine:batch': [':platform:engine:source'],
            ':markets:cn': [':platform:core'],
            ':markets:cn:source': [':markets:cn', ':platform:engine:source'],
            ':markets:cn:data': [':platform:app-support', ':markets:cn', ':platform:engine:questdb', ':platform:runtime-support'],
            ':markets:cn:data-app': [':markets:cn:data', ':markets:cn:batch', ':markets:cn:source', ':markets:us', ':platform:runtime-support'],
            ':markets:cn:batch': [':markets:cn:source', ':platform:engine:batch', ':platform:runtime-support'],
            ':markets:us': [':platform:engine:source'],
            ':markets:us:data-app': [':markets:us', ':platform:engine:questdb', ':platform:runtime-support'],
            ':markets:btc': [':platform:core'],
            ':markets:btc:data-app': [':markets:btc', ':platform:engine:source', ':platform:engine:questdb', ':platform:runtime-support'],
            ':platform:app-support': [':platform:engine:questdb', ':platform:runtime-support'],
            ':markets:cn:main-strategy-runtime': [':markets:cn:data', ':markets:cn:batch', ':markets:us', ':platform:runtime-support'],
            ':markets:cn:l2-live-app': [':platform:core', ':platform:runtime-support']
        ]
        def ownDependencies = { p ->
            p.configurations.findAll { it.name in ['api', 'implementation', 'runtimeOnly', 'compileOnly'] }
                .collectMany { it.dependencies.withType(ProjectDependency).collect { d -> d.dependencyProject.path } }.toSet()
        }
        requireCondition(modules.collect { it.path }.toSet() == expected.keySet(), '模块清单与边界检查不同步')
        expected.each { path, allowed ->
            requireCondition(ownDependencies(project(path)) == allowed.toSet(), "模块依赖越界：${path}，实际 ${ownDependencies(project(path))}")
        }
        // 不能靠旧源码数量常量通过检查；逐个核对当前源码与 jar 的实际归属。
        def readEntries = { archive ->
            new java.util.zip.ZipFile(archive).withCloseable { zip ->
                def entries = zip.entries().collect { it.name }
                requireCondition(entries.size() == entries.toSet().size(), "jar 内有重复项：${archive}")
                entries.toSet()
            }
        }
        def entriesByModule = [:]
        def owners = [:]
        modules.each { module ->
            def entries = readEntries(module.tasks.named('jar').get().archiveFile.get().asFile)
            entriesByModule[module.path] = entries
            def sourceTypes = module.sourceSets.main.java.files.collect { source ->
                def sourceRoot = module.sourceSets.main.java.srcDirs.find { source.toPath().startsWith(it.toPath()) }
                sourceRoot.toPath().relativize(source.toPath()).toString().replace('\\', '/').replaceAll(/\.java$/, '')
            }.toSet()
            new java.util.zip.ZipFile(module.tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
                entries.findAll { it.endsWith('.class') }.each { entry ->
                    // 一个文件可以定义多个包级类型，按 class 的 SourceFile 属性核对真实源码。
                    def model = java.lang.classfile.ClassFile.of().parse(zip.getInputStream(zip.getEntry(entry)).bytes)
                    def sourceFile = model.attributes().find { it instanceof java.lang.classfile.attribute.SourceFileAttribute }?.sourceFile()?.stringValue()
                    def packagePath = entry.substring(0, entry.lastIndexOf('/') + 1)
                    def sourceType = sourceFile == null ? null : packagePath + sourceFile.replaceAll(/\.java$/, '')
                    requireCondition(sourceType != null && sourceTypes.contains(sourceType), "旧构建或无所属源码的类：${module.path} ${entry}")
                    requireCondition(!owners.containsKey(entry), "类被重复打包：${entry}，${owners[entry]} / ${module.path}")
                    owners[entry] = module.path
                }
            }
            def output = module.layout.buildDirectory.get().asFile.toPath()
            requireCondition(output.startsWith(rootProject.layout.buildDirectory.get().asFile.toPath()), "模块产物没有放在根 build：${module.path}")
        }
        def outputs = modules.collect { it.layout.buildDirectory.get().asFile.toPath() }
        outputs.eachWithIndex { current, index ->
            outputs.eachWithIndex { other, otherIndex ->
                if (index != otherIndex) requireCondition(!current.startsWith(other), "父模块输出覆盖子模块：${current} / ${other}")
            }
        }
        requireCondition(core.configurations.runtimeClasspath.files.empty, 'core 运行时不能引入框架或数据库依赖')
        requireCondition(!entriesByModule[core.path].any { it in runtimeConfigFiles || it.startsWith('db/') || it.startsWith('contracts/') }, 'core 夹带应用配置或数据库资源')
        [':platform:engine', ':platform:engine:source', ':platform:engine:questdb', ':platform:engine:batch'].each { path ->
            project(path).sourceSets.main.java.files.each { source ->
                requireCondition(!(source.text =~ /(?:import\s+(?:static\s+)?)com\.zoutrankil\.market\./).find(), "通用引擎反向依赖市场实现：${source}")
            }
        }
        requireCondition(entriesByModule[live.path].contains('com/zoutrankil/data/l2live/bootstrap/AliyunL2LiveMain.class'), '实时 L2 独立入口缺失')
        requireCondition(!live.configurations.runtimeClasspath.files.any { f -> ['postgresql-', 'questdb-client-', 'flyway-', 'poi-', 'spring-web', 'spring-batch', 'quartz-', 'markets-cn-data-', 'markets-cn-batch-'].any { f.name.startsWith(it) } }, '实时 L2 混入数据 API 或离线任务依赖')
        [data, strategy].each { module ->
            requireCondition(!module.configurations.runtimeClasspath.files.any { it.name.contains('mqtt') }, "MQTT 混入 ${module.path}")
        }
        requireCondition(!strategy.configurations.runtimeClasspath.files.contains(data.tasks.named('jar').get().archiveFile.get().asFile), '主策略不能依赖数据 API 入口包')
        requireCondition(readEntries(tasks.named('jar').get().archiveFile.get().asFile) == entriesByModule[data.path], '根兼容 jar 与数据入口不一致')
        requireCondition(!entriesByModule[':platform:app-support'].contains('com/zoutrankil/data/QuestDataApplication.class'), '公共 API 库夹带市场启动入口')
        requireCondition(!entriesByModule[':platform:app-support'].any { it in runtimeConfigFiles || it.startsWith('db/') }, '公共 API 库夹带市场配置或迁移脚本')
        [data, strategy, live].each { module ->
            new java.util.zip.ZipFile(module.tasks.named('jar').get().archiveFile.get().asFile).withCloseable { zip ->
                runtimeConfigFiles.each { name ->
                    def entry = zip.getEntry(name)
                    requireCondition(entry != null && zip.getInputStream(entry).bytes == rootProject.file("config/${name}").bytes,
                            "应用没有打包根配置：${module.path} ${name}")
                }
            }
        }
        def forbidden = ['postgresql-', 'questdb-client-', 'flyway-database-questdb-', 'poi-', 'markets-cn-data-', 'platform-engine-questdb-']
        requireCondition(!batch.configurations.runtimeClasspath.files.any { f -> forbidden.any { f.name.startsWith(it) } }, '离线 Batch 库混入数据服务或 PGWire 驱动')
        requireCondition(entriesByModule[':markets:cn:source'].contains('trust/cfca-ev-root.pem'), '中国债券证书资源丢失')
        requireCondition(entriesByModule[':markets:cn:batch'].contains('META-INF/LICENSE-numpy-l2.txt'), '离线 L2 许可证资源丢失')
        def report = layout.buildDirectory.file('reports/modules/market-boundaries.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                modules: expected.collectEntries { path, deps -> [path, [dependencies: deps, classes: entriesByModule[path].count { it.endsWith('.class') }]] },
                classOwners: owners, duplicateClasses: []])) + '\n'
    }
}
tasks.register('verifyBatchDistributionDatabaseDrivers') {
    group = 'verification'
    description = '核对兼容 Batch 发行包使用统一 A 股入口，且同时包含 SQLite 和 QuestDB 驱动。'
    dependsOn tasks.named('batchDistZip'), tasks.named('verifyModuleBoundaries')
    doLast {
        def archive = tasks.named('batchDistZip').get().archiveFile.get().asFile
        def entries = zipTree(archive).matching { include '**/*.jar' }.files.collect { it.name }
        if (!entries.any { it.startsWith('sqlite-jdbc-') }) throw new GradleException("Batch distribution is missing SQLite JDBC: ${archive}")
        if (!entries.any { it.startsWith('postgresql-') }) throw new GradleException('统一市场发行包缺少 PGWire 驱动')
        if (!entries.contains("QuestDBWithData-${project.version}.jar".toString())) throw new GradleException('兼容发行包缺少 A 股入口')
        if (entries.any { it.startsWith('batch-app-') }) throw new GradleException('兼容发行包仍包含旧 Batch 入口')
    }
}
tasks.register('verifyDependencyVersionCompatibility') {
    group = 'verification'
    description = 'Compare actually resolved module GAVs with the captured pre-module lock versions.'
    doLast {
        def baseline = new groovy.json.JsonSlurper().parse(file('gradle/dependency-baseline-before-modules.json'))
        def additions = new groovy.json.JsonSlurper().parse(file('gradle/dependency-additions-java-strategy.json'))
        def configurationsToCheck = ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath', 'l2RuntimeClasspath']
        def rows = []
        def differences = []
        allprojects.each { p ->
            p.configurations.findAll { it.canBeResolved && it.name in configurationsToCheck }.each { configuration ->
                def oldName = p.path in [':markets:cn:batch', ':platform:engine:batch'] && configuration.name == 'runtimeClasspath' ? 'batchRuntimeClasspath'
                    : configuration.name == 'l2RuntimeClasspath' ? 'runtimeClasspath' : configuration.name
                def expected = baseline.configurations[oldName]
                if (expected == null) throw new GradleException("Missing captured configuration: ${oldName}")
                def actual = new TreeMap<String, String>()
                configuration.incoming.resolutionResult.allComponents.each { component ->
                    def id = component.id
                    if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)
                        actual["${id.group}:${id.module}".toString()] = id.version
                }
                actual.each { coordinate, selected ->
                    // Existing baseline versions remain exact. Only explicitly pinned new modules
                    // in the declared application modules may extend the pre-module dependency set.
                    def allowedAddition = expected[coordinate] == null && p.path in additions.projects && configuration.name in additions.configurations
                        ? additions.versions[coordinate] : null
                    if ((expected[coordinate] ?: allowedAddition) != selected)
                        differences.add([project: p.path, configuration: configuration.name, coordinate: coordinate, expected: expected[coordinate] ?: allowedAddition, actual: selected])
                }
                rows.add([project: p.path, configuration: configuration.name, baselineConfiguration: oldName, selected: actual,
                    removedCoordinates: expected.keySet().findAll { !actual.containsKey(it) }.sort()])
            }
        }
        def report = layout.buildDirectory.file('reports/modules/dependency-version-compatibility.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([baselineLockSha256: baseline.sourceSha256, explicitAdditions: additions, resolved: rows, differences: differences])) + '\n'
        if (!differences.empty) throw new GradleException("Module dependency versions differ from the accepted baseline; see ${report}")
    }
}
tasks.named('check') {
    dependsOn tasks.named('verifyBatchDistributionDatabaseDrivers'), tasks.named('architectureTest'), tasks.named('verifyDependencyVersionCompatibility')
}
tasks.named('assemble') { dependsOn modules.collect { it.tasks.named('jar') } }
tasks.register('resolveDependencyLocks') {
    description = 'Resolve all root and module configurations with --write-locks; never synthesize lockfiles.'
    doLast { allprojects.each { p -> p.configurations.findAll { it.canBeResolved }.each { it.resolve() } } }
}

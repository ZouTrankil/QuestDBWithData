// 父项目 clean 只删除自己的 _output；测试也逐个核对源码归属，避免旧 class 混入聚合运行。
modules.each { module ->
    def verifyTests = module.tasks.register('verifyTestOwnership') {
        group = 'verification'
        dependsOn module.tasks.named('testClasses')
        doLast {
            def sources = module.sourceSets.test.java.files.collect { source ->
                def base = module.sourceSets.test.java.srcDirs.find { source.toPath().startsWith(it.toPath()) }
                base.toPath().relativize(source.toPath()).toString().replace('\\', '/')
            }.toSet()
            module.sourceSets.test.output.classesDirs.files.each { directory ->
                fileTree(directory).matching { include '**/*.class' }.files.each { output ->
                    def model = java.lang.classfile.ClassFile.of().parse(output.bytes)
                    def sourceFile = model.attributes().find { it instanceof java.lang.classfile.attribute.SourceFileAttribute }?.sourceFile()?.stringValue()
                    def name = model.thisClass().asInternalName()
                    def path = name.substring(0, name.lastIndexOf('/') + 1) + sourceFile
                    if (sourceFile == null || !sources.contains(path))
                        throw new GradleException("测试产物没有当前源码：${module.path} ${name}，请清理该模块输出")
                }
            }
            def expectedResources = module.sourceSets.test.resources.files.collect { source ->
                def base = module.sourceSets.test.resources.srcDirs.find { source.toPath().startsWith(it.toPath()) }
                base.toPath().relativize(source.toPath()).toString().replace('\\', '/')
            }.toSet()
            def resourceDirectory = module.sourceSets.test.output.resourcesDir
            def actualResources = fileTree(resourceDirectory).files.collect { output ->
                resourceDirectory.toPath().relativize(output.toPath()).toString().replace('\\', '/')
            }.toSet()
            if (expectedResources != actualResources)
                throw new GradleException("测试资源与源码目录不一致：${module.path}")
        }
    }
    module.tasks.withType(Test).configureEach { dependsOn verifyTests }
}


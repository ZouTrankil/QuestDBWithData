tasks.register('writeL2LiveRuntime') {
    group = 'application'
    description = 'Build the live collector and write its local Java launch paths without starting a subscription.'
    dependsOn live.tasks.named('jar'), live.configurations.runtimeClasspath
    doLast {
        def root = file('var/l2-live').toPath()
        def runtimes = root.resolve('runtime')
        java.nio.file.Files.createDirectories(runtimes)
        def runtimeId = java.util.UUID.randomUUID().toString()
        def snapshot = java.nio.file.Files.createDirectory(runtimes.resolve(runtimeId))
        def libraries = java.nio.file.Files.createDirectory(snapshot.resolve('lib'))
        def artifacts = [live.tasks.named('jar').get().archiveFile.get().asFile] + live.configurations.runtimeClasspath.files.toList()
        // Keep the application's classpath order; Windows filenames are case-insensitive.
        def byName = new LinkedHashMap<String, File>()
        artifacts.each { File source ->
            if (!source.isFile() || !source.name.toLowerCase(java.util.Locale.ROOT).endsWith('.jar'))
                throw new GradleException('Live runtime requires regular jar artifacts')
            def key = source.name.toLowerCase(java.util.Locale.ROOT)
            def previous = byName.putIfAbsent(key, source.canonicalFile)
            if (previous != null && !java.nio.file.Files.isSameFile(previous.toPath(), source.toPath()))
                throw new GradleException('Live runtime jar filename collision: ' + source.name)
        }
        def sha256 = { java.nio.file.Path path ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            java.nio.file.Files.newInputStream(path).withCloseable { input ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            java.util.HexFormat.of().formatHex(digest.digest())
        }
        def manifest = []
        def classpath = []
        byName.values().each { File source ->
            def before = sha256(source.toPath())
            def target = libraries.resolve(source.name)
            java.nio.file.Files.copy(source.toPath(), target, java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
            def copied = sha256(target)
            if (before != copied) throw new GradleException('Live runtime jar changed during snapshot copy')
            manifest.add([name: source.name, bytes: java.nio.file.Files.size(target), sha256: copied])
            classpath.add(target.toAbsolutePath().toString().replace('\\', '/'))
        }
        def receipt = [runtimeId: runtimeId, createdAt: java.time.Instant.now().toString(), libraries: manifest]
        java.nio.file.Files.writeString(snapshot.resolve('manifest.json'),
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(receipt)), java.nio.charset.StandardCharsets.UTF_8,
                java.nio.file.StandardOpenOption.CREATE_NEW)
        def publishPath = { String name, String value ->
            def pending = root.resolve(name + '.' + runtimeId + '.tmp')
            java.nio.file.Files.writeString(pending, value, java.nio.charset.StandardCharsets.UTF_8, java.nio.file.StandardOpenOption.CREATE_NEW)
            try {
                java.nio.file.Files.move(pending, root.resolve(name), java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.nio.file.AtomicMoveNotSupportedException unsupported) {
                java.nio.file.Files.move(pending, root.resolve(name), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        publishPath('runtime-classpath.txt', classpath.join(File.pathSeparator))
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(24) }.get()
        publishPath('java-path.txt', launcher.executablePath.asFile.absolutePath.replace('\\', '/'))
    }
}


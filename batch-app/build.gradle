plugins { id 'application' }
dependencies {
    implementation project(':market-cn:batch')
    implementation project(':market-us')
    implementation project(':runtime-support')
}
application { mainClass = 'com.zoutrankil.batch.BatchApplication' }
tasks.named('jar') { archiveBaseName = 'QuestDBWithData'; archiveClassifier = 'batch' }

// 保留服务分发包与离线 L2 的历史依赖版本，避免迁模块时顺带改变计算环境。
def batchRuntime = configurations.runtimeClasspath
configurations.create('l2RuntimeClasspath') {
    canBeConsumed = false
    canBeResolved = true
    extendsFrom batchRuntime
    attributes {
        batchRuntime.attributes.keySet().each { key -> attribute(key, batchRuntime.attributes.getAttribute(key)) }
    }
    resolutionStrategy.force 'commons-io:commons-io:2.21.0'
}
configurations.named('runtimeClasspath') { resolutionStrategy.force 'commons-io:commons-io:2.20.0' }
configurations.matching { it.name in ['compileClasspath', 'testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    resolutionStrategy.force 'commons-io:commons-io:2.21.0'
}

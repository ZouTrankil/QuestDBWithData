# 公共默认值；市场设置在 markets/，各进程设置在 apps/。
# 入口自动选择 profile，环境变量和命令行仍可覆盖。
spring:
  profiles:
    default: data
    group:
      data: [market-cn]
      main-strategy: [data, market-cn]
      batch: [market-cn]
      l2: [market-cn]

logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
  file:
    path: logs/${spring.application.name:questdb-data}
    name: ${logging.file.path}/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
    file: "${logging.pattern.console}"
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.path}/application.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 1GB
      clean-history-on-start: true

app:
  tushare:
    # 数据源 token 使用本机覆盖或 APP_TUSHARE_TOKEN。
    token: ""
    api-url: https://api.tushare.pro
    connect-timeout: 15s
    response-timeout: 45s
    request-timeout: 50s
    global-per-minute: 20
    endpoint-per-minute: 10
    endpoint-limits: {}
    concurrency: 2
    queue-capacity: 16
    max-attempts: 3
    total-timeout: 2m
    retry-base: 1s
    retry-max: 10s
    retryable-business-codes: []
  data-catalog:
    query-timeout-seconds: 10

  questdb:
    # 当前数据库：HTTP http://100.64.153.106:9000；PGWire 100.64.153.106:8812。
    host: 100.64.153.106
    # JDBC 查询端口。
    pg-port: 8812
    # HTTP 查询及写入端口。
    qwp-port: 9000
    username: admin
    password: ""
    database: qdb
    # 默认让本数据库绕过 HTTP / SOCKS 全局代理；其他网站仍使用原代理。
    direct-connection: true
    # 默认解析为 http://100.64.153.106:9000；无需另找 URL 配置。
    http-url: http://${app.questdb.host}:${app.questdb.qwp-port}
    # 当前实例 HTTP 无需 Authorization；空字符串是有效配置，不是待填占位。
    http-authorization: ""
    visibility-timeout: 10s
    poll-interval: 100ms
    write-batch-rows: 250
    write-batch-bytes: 1048576
    write-max-batches: 100
  sync:
    ledger-path: var/sync-ledger.sqlite3


---
# 相对路径同时适用于项目目录和发行包；后面的本机覆盖优先于公开默认值。
spring.config.import:
  - markets/cn.yml
  - markets/us.yml
  - markets/btc.yml
  - apps/cn-data.yml
  - apps/cn-batch.yml
  - apps/cn-l2-live.yml
  - apps/cn-main-strategy.yml
  - "${APP_LOCAL_CONFIG:optional:file:./config/application-local.yml}"

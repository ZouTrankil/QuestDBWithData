# A 股共用设置；只有 market-cn profile 会加载。
spring.config.activate.on-profile: market-cn
app:
  materialized-views:
    backtest:
      # 读取配置本身不刷新；只有显式维护命令可发 FULL。
      layout-version: 1
      suspend-table: stk_suspend
      suspend-layout-version: 1
      st-table: stk_st_daily
      st-layout-version: 1
      v2-output-table: java_backtest_v2_current
      refresh-timeout: 2m
    etf-overview:
      # 新版单独保存输出；原正式 MV 和原刷新凭证不改。
      layout-version: 1
      v2-output-table: java_etf_overview_v2_current
  sync:
    # 新任务和读取使用同版；旧请求按原账本恢复，正式迁移另验收。
    etf-adj-schema-version: 1
    etf-daily-schema-version: 1
    etf-share-schema-version: 1
    stk-st-daily-schema-version: 1
    stk-suspend-schema-version: 1
    l2-daily-features-schema-version: 1
    # 指数正式trade_date布局显式选v2；默认保留原隔离任务及恢复。
    index-daily-market-schema-version: 1
    index-daily-market-table: java_d019_index_daily_market_acceptance
    # ETF目录可显式绑定原etf_basic；默认仍保留原隔离目标。
    etf-basic-table: java_d013_etf_basic_acceptance
    # 写入默认仍隔离；旧moneyflow-ths-table覆盖继续有效，读取原默认不改。
    margin-all-write-table: ${app.sync.margin-all-table:java_d028_margin_all_acceptance}
    margin-secs-write-table: ${app.sync.margin-secs-table:java_d030_margin_secs_acceptance}
    moneyflow-ths-write-table: ${app.sync.moneyflow-ths-table:java_d025_moneyflow_ths_acceptance}
    retail-sentiment-daily:
      # 只供 v2 隔离链路；v1 继续使用原正式 MV。
      v2-target-table: java_d098_mv_retail_sentiment_daily_v2
    stk-suspend-table: stk_suspend_d011_isolated
  read:
    # 读取保留正式表默认值；隔离验收时可单独覆盖，不跟随同步目标换表。
    stk-suspend-table: stk_suspend
  time:
    # 旧入口继续表示 A 股业务日期；三个市场各用自己的时钟。
    business-zone: Asia/Shanghai
    markets:
      cn: Asia/Shanghai
  paths:
    # 本机相邻 Python 项目；从 Java 项目根目录启动时可直接找到。
    research-root: ../back-monitor
    l2-dataset-root: ${app.paths.research-root}/artifacts/level2_t0_dataset

# 美股采集使用独立入口，不启动 A 股调度器。私密值只放 application-local.yml。
spring.config.activate.on-profile: us-data
spring.application.name: us-market-data
app.market-data:
  root: var/market-data
  tiingo-token: ""
  fred-key: ""
  fred-proxy-url: ""
  # 仅为已验证的接口请求头兼容值，正式采集和写入均由 Java 执行。
  fred-user-agent: python-requests/2.32.5
  # 官方 VIX 公开日收盘 CSV，按小时限频，独立于 FRED 和股票日线。
  cboe-vix-url: https://cdn-api.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
  cboe-requests-per-hour: 2
  cboe-requests-per-day: 8
  cboe-monthly-bytes: 67108864
  cboe-request-spacing-ms: 60000
  # 首波只维护日线与小时线；ITCH 已归档退出，恢复须显式覆盖并检查原停止标记。
  itch-enabled: false
  # 原来源与预算保留作归档追溯，不表示自动恢复采集。
  itch-source-url: https://emi.nasdaq.com/ITCH/Nasdaq%20ITCH/S061226-v50.txt.gz
  itch-file-date: "2026-06-12"
  itch-sample-local-time: "09:31"
  itch-sample-message-count: 100000
  itch-range-bytes: 8388608
  itch-prefix-limit-bytes: 1073741824
  itch-maximum-scan-messages: 100000000
  itch-requests-per-hour: 240
  itch-requests-per-day: 1000
  itch-monthly-bytes: 4294967296
  itch-request-spacing-ms: 2000
  history-start: 2006-01-01
  minute-start: 2026-01-01
  benchmark-symbols: [SPY, QQQ, IWM, TLT, GLD, USO]
  core-stock-symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, TSLA, AVGO, JPM, WMT]
  tiingo-hourly-requests: 50
  tiingo-daily-requests: 1000
  tiingo-monthly-symbols: 500
  tiingo-request-spacing-ms: 2000
  tiingo-monthly-bytes: 1073741824
  yahoo-requests-per-hour: 1800
  yahoo-requests-per-day: 20000
  yahoo-monthly-bytes: 21474836480
  yahoo-request-spacing-ms: 2000
  broad-prefetch-enabled: true
  broad-prefetch-buffer-symbols: 256
  broad-source-max-attempts: 3
  broad-source-retry-delay-ms: 5000
  broad-annual-enabled: true
  broad-annual-symbols: 128
  broad-publication-symbols: 12
  broad-publication-page-rows: 32768
  broad-publication-page-bytes: 33554432

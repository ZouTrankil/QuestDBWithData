# 独立、有限、只读公开行情来源；不加载任何交易或下单组件。
spring.config.activate.on-profile: btc-data
spring.application.name: crypto-market-data
app.crypto-data:
  root: var/crypto-market-data
  history-start: 2021-10-01
  # 六组原生 BTCUSDT 数据单独设起点，不改变旧 collect 的冻结任务。
  archive-history-start: 2020-01-01
  requests-per-hour: 2000
  requests-per-day: 20000
  request-spacing-ms: 400
  bytes-per-31-days: 5368709120
  # 官方说明 11:27 停市、14:00 恢复；归档和 REST 都没有 13:00 的小时线。
  venue-closures:
    - exchange: BINANCE
      instrument: SPOT
      from: "2023-03-24T11:27:00Z"
      until: "2023-03-24T14:00:00Z"
      evidence-url: https://www.binance.com/en/blog/from-our-ceo/6789340645608890113
  # 沿用价兼容模式的最大年龄；同步小时模式仍要求前一完整小时。
  research-price-max-age-seconds: 7200
  # 日更只调用原 Java writer；每轮固定截止日，来源失败最多尝试两轮。
  daily-source-attempts: 2
  daily-timeout-seconds: 3600
  daily-log-retention-days: 30
  daily-max-root-bytes: 10737418240
  daily-min-free-bytes: 1073741824
  daily-max-lag-days: 1
  # 每日两个完整月；每周最多再轮查一个旧月，共不超过十八个文件。
  revision-recent-months: 2
  revision-max-files: 18
  # 同一 UTC 日首次 01:00，失败每三小时续跑，最多八次；成功后当天停止重试。
  schedule-start-utc-hour: 1
  schedule-retry-hours: 3
  schedule-max-attempts: 8

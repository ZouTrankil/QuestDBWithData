plugins { id 'application' }

dependencies {
    // 仅集成测试对照入口行为，不进入生产依赖或分发包。
    testImplementation project(':market-cn:data-app')
    runtimeOnly project(':market-us')
    implementation project(':market-cn:data')
    implementation project(':runtime-support')
    implementation project(':market-cn:batch')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.21.5'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    testImplementation 'tools.jackson.core:jackson-databind:3.1.5'
    implementation 'org.apache.parquet:parquet-hadoop:1.17.1'
    implementation 'org.apache.hadoop:hadoop-client-api:3.4.2'
    runtimeOnly 'org.apache.hadoop:hadoop-client-runtime:3.4.2'
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot'
    implementation 'org.springframework.batch:spring-batch-core'
    implementation 'org.springframework:spring-context-support'
    implementation 'org.quartz-scheduler:quartz'
    implementation('org.flywaydb:flyway-core') { version { strictly '11.9.0' } }
}

application {
    applicationName = 'main-strategy'
    mainClass = 'com.zoutrankil.strategy.MainStrategyApplication'
    applicationDefaultJvmArgs = ['-Xms256m', '-Xmx4g']
}

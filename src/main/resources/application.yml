spring:
  datasource:
    url: "jdbc:postgresql://${app.questdb.host}:${app.questdb.pg-port}/${app.questdb.database}?sslmode=disable"
    username: "${app.questdb.username}"
    password: "${app.questdb.password}"
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 4

server:
  port: ${APP_PORT:8080}

app:
  web:
    enabled: true
    # Empty means development mode without authentication. Set APP_API_TOKEN in production.
    api-token: ${APP_API_TOKEN:}
    allowed-origins: ${APP_ALLOWED_ORIGINS:*}

  time:
    business-zone: Asia/Shanghai
  migration:
    location: classpath:db/migration/questdb
    history-table: java_tushare_schema_history
  tushare:
    token: "43748a5da1339b43a4956da729ae791f4e25ce9a15a356060658ffe6"
    api-url: "https://api.tushare.pro"
    connect-timeout: 15s
    response-timeout: 45s
    request-timeout: 50s
  questdb:
    host: 100.97.201.8
    pg-port: 8812
    qwp-port: 9000

    username: admin
    # Replace this with the QuestDB password used by your instance.
    password: "quest"
    database: qdb
    visibility-timeout: 10s
    poll-interval: 100ms

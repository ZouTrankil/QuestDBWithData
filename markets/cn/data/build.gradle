plugins { id 'java-library' }

dependencies {
    // 仅集成测试对照入口行为，不进入生产依赖或分发包。
    testImplementation project(':markets:cn:data-app')
    api project(':platform:app-support')
    api project(':markets:cn')
    implementation project(':markets:cn:source')
    api project(':platform:engine:questdb')
    api project(':platform:runtime-support')
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'
    api 'org.xerial:sqlite-jdbc:3.53.4.0'
    runtimeOnly 'org.postgresql:postgresql:42.7.7'
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    api 'org.springframework.boot:spring-boot-starter-webclient'
    api 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.questdb:questdb-client:1.3.8'
    api 'org.apache.poi:poi:5.5.1'
    api 'org.apache.parquet:parquet-hadoop:1.17.1'
    api 'org.apache.hadoop:hadoop-client-api:3.4.2'
    runtimeOnly 'org.apache.hadoop:hadoop-client-runtime:3.4.2'
    implementation('org.flywaydb:flyway-core') { version { strictly '11.9.0' } }
    runtimeOnly 'org.flywaydb:flyway-database-questdb:10.26.0'
}

// 历史原件另做对照验收，普通离线测试不冒充原件验收。
tasks.register('retainedParityTest', Test) {
    group = 'verification'
    description = '运行保留原始资料的对照验收；缺少输入时明确失败。'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    workingDir rootProject.projectDir
    systemProperty 'cli.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
    useJUnitPlatform {
        excludeTags = [] as Set
        includeTags 'retained-parity'
    }
    environment 'RUN_RETAINED_PARITY', '1'

    doFirst {
        def originals = [
            'artifacts/java-migration/D001/physical-baseline.json',
            'artifacts/java-migration/D002/physical-baseline.json',
            'artifacts/java-migration/D003/source-catalog.csv',
            'artifacts/java-migration/D004/physical-baseline.json',
            'artifacts/java-migration/D005/discovery-8303c5c1-b6ec-4472-9a0d-0d9e2486ea66/classification-8b4429b7-1613-49cd-9692-e6ce0422602a.json',
            'artifacts/java-migration/D005/source-preflight-e26420e4-9eda-41a7-9a91-2329ce57419f/Y-response.json',
            'artifacts/java-migration/D005/source-preflight-e26420e4-9eda-41a7-9a91-2329ce57419f/N-response.json',
            'artifacts/java-migration/D005/physical-baseline.json',
            'artifacts/java-migration/D005/read-live.json'
        ]
        def missing = originals.findAll { relative ->
            !java.nio.file.Files.isRegularFile(rootProject.file(relative).toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS)
        }
        if (!missing.empty) throw new GradleException('Retained parity unavailable; original files are required: ' + missing.join(', '))
        def classification = rootProject.file('artifacts/java-migration/D005/discovery-8303c5c1-b6ec-4472-9a0d-0d9e2486ea66/classification-8b4429b7-1613-49cd-9692-e6ce0422602a.json')
        def actual = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-256').digest(classification.bytes))
        if (actual != '00936922ec3a79d7105e7cae37d28d955ebc41da1c67de9c45bc87024817d668') throw new GradleException('Original retained classification SHA-256 differs')
        // 其他原件没有保留固定摘要，不能补造来源证明。
    }
}
